{% extends 'base.html' %}

{% block content %}

<h1 class="text-uppercase">Your Email Signature</h1>

<div class="signature-card-container">
    
    <div class="signature-card p-4"> 
        
        <table cellpadding="0" cellspacing="0" border="0" style="width: 100%; font-family: 'Poppins', Arial, sans-serif; border-collapse: collapse;">
            <tr>
                {% if image_url %}
                <td style="padding-right: 15px; width: 80px; vertical-align: top;">
                    <img src="{{ image_url }}" alt="Profile Image"
                        style="border-radius: 50%; width: 75px; height: 75px; object-fit: cover; border: 2px solid #007bff; display: block;">
                </td>
                <td style="padding-right: 15px; width: 1px; background-color: #e9ecef;">
                    <div style="width: 1px; height: 75px; background-color: #e9ecef;"></div>
                </td>
                {% endif %}

                <td style="vertical-align: top; padding-left: 15px;">
                    <p style="margin: 0; font-size: 18px; font-weight: 700; color: #343a40;">{{ name }}</p>
                    <p style="margin: 0 0 8px 0; font-size: 14px; font-weight: 500; color: #007bff;">{{ title }}</p>

                    <div style="font-size: 13px; line-height: 1.5;">
                        <p style="margin: 0;">
                            <strong style="color: #495057;">Email:</strong> 
                            <a href="mailto:{{ email }}" style="color: #007bff; text-decoration: none;">{{ email }}</a>
                        </p>
                        {% if phone %}
                        <p style="margin: 0;">
                            <strong style="color: #495057;">Phone:</strong> 
                            <a href="tel:{{ phone }}" style="color: #007bff; text-decoration: none;">{{ phone }}</a>
                        </p>
                        {% endif %}
                        {% if website %}
                        <p style="margin: 0;">
                            <strong style="color: #495057;">Website:</strong> 
                            <a href="{{ website }}" style="color: #007bff; text-decoration: none;">{{ website }}</a>
                        </p>
                        {% endif %}
                    </div>
                </td>
            </tr>
        </table>
    </div>
</div>

<div class="d-flex justify-content-center mt-4">
    <a href="{% url 'generate_signature' %}" class="btn btn-secondary px-4 py-2">Generate Another</a>
</div>

{% endblock content %}
